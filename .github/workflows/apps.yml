# Builds the Android APK and the Windows app, and publishes them as a GitHub release:
# pushes to main update the release "latest", tags v* make a versioned release.
# Pull requests only build (the files are attached to the run as artifacts).
# Optional secrets for a private Android signing key: ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (see README).
name: apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the public test key."
          fi
      - run: node prepare.mjs
        env:
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
          VERSION_CODE: ${{ github.run_number }}
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/android/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk Vathography-Studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/android/Vathography-Studio.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/desktop/dist/*.exe
          if-no-files-found: error

  release:
    needs: [android, windows]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la out
          cat > notes.md <<NOTES
          **Android:** download \`Vathography-Studio.apk\` on the phone and open it (allow installing from this source once).
          **Windows:** \`Vathography-Studio-Setup.exe\` installs the app, \`Vathography-Studio-Portable.exe\` runs without installing. Windows SmartScreen may warn because the app is not code-signed: *More info → Run anyway*.
          **Browser:** https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/

          Built from ${GITHUB_SHA::7}.
          NOTES
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" out/* --repo "$REPO" --title "Vathography Studio $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release delete latest --repo "$REPO" --cleanup-tag --yes || true
            gh release create latest out/* --repo "$REPO" --target "$GITHUB_SHA" --title "Vathography Studio (latest build)" --notes-file notes.md --latest
          fi
